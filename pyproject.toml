[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "emublog2mlv"
version = "1.2.0"
description = "Convert ECU Master EMU Black .emublog binary logs to MegaLogViewer HD (.msl / .csv)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eric W" }]
keywords = [
    "ECU Master", "EMU Black", "emublog", "MegaLogViewer", "MegaSquirt",
    "msl", "datalog", "engine tuning", "2JZ", "telemetry",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/zazzn/emublog2mlv"
Repository = "https://github.com/zazzn/emublog2mlv"
Issues = "https://github.com/zazzn/emublog2mlv/issues"

[project.scripts]
emublog2mlv = "emublog2mlv.cli:main"
emublog2mlv-mcp = "emublog2mlv.mcp_server:main"

[project.gui-scripts]
emublog2mlv-gui = "emublog2mlv.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
